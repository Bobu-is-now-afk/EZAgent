<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EZAgent · 本機模型示範</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#17232a;background:#f5f3ed}body{margin:0}.wrap{max-width:880px;margin:auto;padding:52px 20px}h1{font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.04em;margin:.3em 0}p{line-height:1.6;color:#4d5a5d}.badge{display:inline-block;padding:7px 12px;border:1px solid #b4c9c5;border-radius:30px;color:#315a55;font-size:.8rem}main{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:36px}section{background:white;border:1px solid #e0e2dd;border-radius:20px;padding:24px;box-shadow:0 8px 24px #193a2910}h2{margin-top:0}textarea{box-sizing:border-box;width:100%;height:118px;padding:14px;border:1px solid #abb8b2;border-radius:12px;font:inherit;resize:vertical}button{margin-top:14px;background:#123d38;color:white;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f3;border-radius:12px;min-height:84px;margin-top:16px;padding:15px;font-size:.95rem}.note{font-size:.85rem}
  </style>
</head>
<body><div class="wrap"><span class="badge">Mac mini · Ollama · qwen3.5:9b</span><h1>把模糊想法變成可檢查的結果</h1><p>左邊直接問本機模型；右邊讓模型只選一個示範項目，價格由固定清單計算。兩條路都在這部 Mac 上執行。</p>
<main><section><h2>直接對話</h2><p>試試自由提問。</p><form id="chat"><textarea name="prompt" maxlength="2000">幫我用一句話介紹本機 AI。</textarea><button>送出問題</button></form><div class="result" id="chat-result" aria-live="polite">等待輸入</div></section>
<section><h2>受控的 AI 草稿</h2><p>描述需求；AI 只選項目和數量，不決定價格，也不會建立真實訂單。</p><form id="agent"><textarea name="request" maxlength="1000">我需要兩次設計諮詢</textarea><button>產生報價草稿</button></form><div class="result" id="agent-result" aria-live="polite">等待輸入</div><p class="note">示範價格：設計 HKD 500、印前處理 HKD 200、諮詢 HKD 300。結果僅供展示。</p></section></main>
<p class="note">本頁只在 127.0.0.1 開啟；公開網站串接需另行設定 HTTPS 閘道與存取限制。</p></div>
<script>
  for (const [formId, endpoint, field, resultId] of [['chat','/api/model','prompt','chat-result'],['agent','/api/demo-agent','request','agent-result']]) {
    const form=document.getElementById(formId), output=document.getElementById(resultId)
    form.addEventListener('submit', async event => {
      event.preventDefault(); const button=form.querySelector('button'); button.disabled=true; output.textContent='本機模型處理中…'
      try { const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({[field]:form.elements[field].value})}); const data=await response.json();
        if (!response.ok) throw new Error(data.error==='model_busy'?'模型忙碌，請稍後重試。':data.error==='draft_not_understood'?'請試著說明是設計、印前處理或諮詢。':'模型暫時無法回覆。')
        output.textContent=formId==='chat' ? data.answer : `${data.draft.quantity} × ${data.draft.description}\n單價 HKD ${data.draft.unitPrice}\n草稿總額 HKD ${data.draft.total}\n\n此為示範草稿，請人工核對。`
      } catch(error) { output.textContent=error.message } finally { button.disabled=false }
    })
  }
</script></body></html>
