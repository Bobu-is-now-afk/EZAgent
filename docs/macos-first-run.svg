<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">EZAgent first run on Mac</title>
  <desc id="desc">Check the Mac requirements, open EZAgent from Applications, and optionally prepare local AI from the Documents workbench.</desc>
  <rect width="1120" height="520" rx="28" fill="#f5f3ee"/>
  <text x="64" y="74" fill="#18332d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700">EZAgent on your Mac</text>
  <text x="64" y="111" fill="#52645d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">A local documents workspace. AI setup is optional.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="54" y="155" width="315" height="278" rx="20" fill="#fff" stroke="#d7ded8" stroke-width="2"/>
    <circle cx="91" cy="195" r="20" fill="#d8eee3"/><text x="85" y="202" fill="#18332d" font-size="19" font-weight="700">1</text>
    <text x="124" y="202" fill="#18332d" font-size="22" font-weight="700">Check requirements</text>
    <rect x="87" y="233" width="246" height="130" rx="12" fill="#f2f6f3"/>
    <text x="108" y="267" fill="#18332d" font-size="18" font-weight="600">Apple silicon Mac</text>
    <text x="108" y="300" fill="#18332d" font-size="18">16 GB RAM for default AI</text>
    <text x="108" y="333" fill="#18332d" font-size="18">8 GB free model storage</text>
    <text x="87" y="397" fill="#52645d" font-size="16">Ollama is separate and optional.</text>

    <path d="M380 294h35m-12-12 12 12-12 12" fill="none" stroke="#80918a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="422" y="155" width="315" height="278" rx="20" fill="#fff" stroke="#d7ded8" stroke-width="2"/>
    <circle cx="459" cy="195" r="20" fill="#d8eee3"/><text x="453" y="202" fill="#18332d" font-size="19" font-weight="700">2</text>
    <text x="492" y="202" fill="#18332d" font-size="22" font-weight="700">Open EZAgent</text>
    <rect x="465" y="233" width="230" height="130" rx="12" fill="#18332d"/>
    <rect x="482" y="250" width="196" height="91" rx="7" fill="#f7faf8"/>
    <circle cx="496" cy="263" r="4" fill="#70ae87"/><circle cx="510" cy="263" r="4" fill="#d7ded8"/>
    <text x="500" y="294" fill="#18332d" font-size="16" font-weight="600">Documents</text>
    <rect x="500" y="308" width="155" height="8" rx="4" fill="#dce7e0"/><rect x="500" y="324" width="110" height="8" rx="4" fill="#dce7e0"/>
    <text x="465" y="397" fill="#52645d" font-size="16">Move app to Applications, then open.</text>

    <path d="M748 294h35m-12-12 12 12-12 12" fill="none" stroke="#80918a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="790" y="155" width="276" height="278" rx="20" fill="#fff" stroke="#d7ded8" stroke-width="2"/>
    <circle cx="827" cy="195" r="20" fill="#d8eee3"/><text x="821" y="202" fill="#18332d" font-size="19" font-weight="700">3</text>
    <text x="860" y="202" fill="#18332d" font-size="22" font-weight="700">Choose local AI</text>
    <rect x="824" y="239" width="208" height="59" rx="11" fill="#edf5ef" stroke="#c5d9cb"/>
    <text x="844" y="264" fill="#18332d" font-size="15" font-weight="600">Local AI setup</text>
    <text x="844" y="284" fill="#52645d" font-size="13">Ollama ready · model needed</text>
    <rect x="824" y="315" width="208" height="45" rx="9" fill="#187653"/>
    <text x="848" y="343" fill="#fff" font-size="16" font-weight="600">Prepare local AI</text>
    <text x="824" y="397" fill="#52645d" font-size="15">Only this button starts setup.</text>
  </g>
  <text x="64" y="481" fill="#52645d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Structured orders and drafts work without AI. Preparing a model needs an internet connection.</text>
</svg>
